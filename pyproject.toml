[project]
name = "mergeability"
version = "0.1.0"
description = "Predicting model-merging success from weight- and representation-space signals"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "timm>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
language = [
    "transformers>=4.50",
    "peft>=0.14",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeability"]
