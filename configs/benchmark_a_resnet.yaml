# Cross-architecture control for Benchmark A.
# Identical to benchmark_a.yaml in every respect except the backbone: same
# resolution, same optimizer, same schedule, same seeds, same task families.
# If the predictor ranking is a property of merging rather than of ViTs, it must
# survive this swap.
# Everything here is held fixed across regimes and seeds; only the task family
# (semantic vs random CIFAR-100 splits) changes.
name: benchmark_a_resnet

seeds: [0, 1]

backbone:
  name: resnet18
  # 128, not 224: measured with scripts/check_resolution.py. Linear-probe
  # accuracy is 47.9 / 71.6 / 78.8 % at 64 / 128 / 224 for this backbone, so 64
  # is unusable and 224 buys 7 points for 3.4x the compute. ResNet-18, the
  # cross-architecture control, is within 1.2 points of its own ceiling at 128,
  # so both backbones run at the same resolution and the control changes
  # exactly one variable.
  img_size: 128
  pretrained: true

data:
  root: data
  # The cross-architecture control only needs the two extremes of the axis:
  # it asks whether the predictor ranking survives a change of architecture,
  # not how the ranking varies along the axis.
  regimes: [semantic, random]
  num_tasks: 5
  split_seed: 0

train:
  epochs: 5
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_frac: 0.1
  label_smoothing: 0.0
  grad_clip: 1.0
  eval_batch_size: 256

output:
  checkpoints: checkpoints
  results: results/raw
